name: Tests unitaires auth

on:
  pull_request:
    paths:
      - "services/auth/**"
      - "tests/contract/**"
      - "docs/api/gateway.openapi.yaml"
      - ".github/workflows/unit-auth.yml"
  workflow_dispatch:

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install -r services/auth/requirements-dev.txt

      - name: pytest
        working-directory: services/auth
        run: pytest
