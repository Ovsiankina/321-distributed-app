name: Garantie d'attribution humaine

# But : garantir que les commits sont consciemment attribués à des humains.
# Ce n'est PAS une politique anti-IA — l'usage d'outils IA reste autorisé.
# On interdit seulement de crediter une IA comme co-auteur/auteur d'un commit,
# afin d'éviter l'automatisation lourde « en pilote automatique » et de garder
# une responsabilité humaine explicite sur chaque commit (cf. CLAUDE.md, règle b).

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-human-authorship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier l'absence de co-attribution IA dans les commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Motifs d'attribution IA interdits dans le MESSAGE de commit
          # (trailers de co-auteur et pieds de page « generated with »).
          MESSAGE_PATTERNS=(
            'co-authored-by:.*claude'
            'co-authored-by:.*anthropic'
            'co-authored-by:.*chatgpt'
            'co-authored-by:.*openai'
            'co-authored-by:.*\bcodex\b'
            'co-authored-by:.*copilot'
            'co-authored-by:.*cursor'
            'co-authored-by:.*gemini'
            'co-authored-by:.*\bgpt\b'
            'co-authored-by:.*noreply@anthropic\.com'
            'generated with \[?claude'
            'generated by claude'
            'generated with \[?chatgpt'
            'generated with \[?copilot'
            'co-authored-by:.*<[^>]*\bai\b[^>]*bot'
            '🤖 generated with'
          )

          # Motifs interdits dans l'IDENTITÉ (auteur/committer) du commit.
          # Cursor est surveillé de près : son agent peut committer directement
          # en tant que « Cursor Agent <cursoragent@cursor.com> » — ce qui
          # n'apparaît PAS dans un trailer et échapperait au seul scan du message.
          # « cursor » (nu) couvre le nom « Cursor », « Cursor Agent »,
          # « cursoragent » et le domaine « @cursor.com » d'un seul motif.
          IDENTITY_PATTERNS=(
            'cursor'
            'anthropic\.com'
            'claude'
            'chatgpt'
            '@openai\.com'
            'copilot'
            'gemini'
          )

          fail=0
          # Liste des commits propres à la PR (base..head).
          commits="$(git log --no-merges --format='%H' "$BASE_SHA".."$HEAD_SHA")"

          if [ -z "$commits" ]; then
            echo "Aucun commit à vérifier."
            exit 0
          fi

          while read -r sha; do
            [ -z "$sha" ] && continue
            msg="$(git log -1 --format='%B' "$sha")"
            # Identité auteur + committer, sur deux lignes « Nom <email> ».
            identity="$(git log -1 --format='%an <%ae>%n%cn <%ce>' "$sha")"
            short="$(git log -1 --format='%h %s' "$sha")"

            for p in "${MESSAGE_PATTERNS[@]}"; do
              if printf '%s' "$msg" | grep -iqE "$p"; then
                echo "::error::Attribution IA dans le message du commit $short (motif : $p)"
                printf '%s' "$msg" | grep -iE "$p" | sed 's/^/    | /'
                fail=1
              fi
            done

            for p in "${IDENTITY_PATTERNS[@]}"; do
              if printf '%s' "$identity" | grep -iqE "$p"; then
                echo "::error::Auteur/committer IA sur le commit $short (motif : $p)"
                printf '%s' "$identity" | grep -iE "$p" | sed 's/^/    | /'
                fail=1
              fi
            done
          done <<< "$commits"

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Un ou plusieurs commits créditent une IA comme (co-)auteur."
            echo "L'usage d'outils IA est autorisé, mais chaque commit doit être"
            echo "attribué à l'humain qui le porte (cf. CLAUDE.md, règle b)."
            echo "Réécrivez le(s) message(s) de commit pour retirer ces mentions"
            echo "puis forcez la mise à jour de la branche de la PR."
            exit 1
          fi

          echo "OK — aucune co-attribution IA détectée. Attribution humaine garantie."
