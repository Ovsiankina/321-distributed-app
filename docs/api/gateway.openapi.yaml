openapi: 3.0.3
info:
  title: API Gateway
  version: 0.1.0
  description: |
    Contrat public de la Gateway (E0-05).

    Surface couverte : santé, stub d'accueil, préfixes proxy.
    Les opérations métier (corps auth, catalogue, stream, sous-titres)
    ne sont pas dans cette version. Elles seront ajoutées par E1-05.

    Toute requête client passe par la Gateway. Aucune URL de microservice
    n'est publique.

servers:
  - url: /
    description: Origine de la Gateway. Le port d'écoute est fixé par E0-04.

tags:
  - name: gateway
    description: Routes produites par la Gateway
  - name: proxy
    description: Forward transparent vers un microservice

paths:
  /health:
    get:
      tags: [gateway]
      operationId: getHealth
      summary: Santé de la Gateway
      responses:
        "200":
          description: Gateway opérationnelle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: gateway

  /api/home:
    get:
      tags: [gateway]
      operationId: getHome
      summary: Accueil (stub)
      description: |
        Enveloppe stable. E0-05 ne définit pas le contenu de `sections`.
        Tant que le catalogue n'est pas contracté, la réponse de référence
        est une liste vide.
      responses:
        "200":
          description: Enveloppe home
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeStubResponse"
              example:
                sections: []
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/auth/{path}:
    parameters:
      - $ref: "#/components/parameters/ProxyPath"
    x-proxied-to: auth
    get:
      tags: [proxy]
      operationId: proxyAuthGet
      summary: Forward GET vers Auth
      description: |
        Forward transparent. Les headers Authorization et Content-Type
        sont transmis sans modification. Le corps de la réponse du
        microservice est hors E0-05.
      responses:
        "200":
          $ref: "#/components/responses/Proxied"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
    post:
      tags: [proxy]
      operationId: proxyAuthPost
      summary: Forward POST vers Auth
      description: |
        Forward transparent. Les headers Authorization et Content-Type
        sont transmis sans modification. Le corps de la réponse du
        microservice est hors E0-05.
      responses:
        "200":
          $ref: "#/components/responses/Proxied"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
    put:
      tags: [proxy]
      operationId: proxyAuthPut
      summary: Forward PUT vers Auth
      description: |
        Forward transparent. Les headers Authorization et Content-Type
