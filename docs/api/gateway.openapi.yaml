components:
  parameters:
    ProxyPath:
      name: path
      in: path
      required: true
      description: |
        Reste du chemin sous le préfixe, transmis tel quel.
        Le runtime forward tout le préfixe (E0-04), y compris plusieurs segments.
      schema:
        type: string

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: gateway

    HomeStubResponse:
      type: object
      additionalProperties: false
      required: [sections]
      properties:
        sections:
          type: array
          description: Schéma des éléments hors E0-05.
          items:
            type: object

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string

  responses:
    Proxied:
      description: |
        Réponse du microservice, transmise sans transformation.
        Le schéma du corps est hors E0-05.
    NotFound:
      description: |
        Préfixe inconnu de la Gateway.
        Une 404 produite par le microservice est transmise telle quelle
        et n'utilise pas forcément ce schéma.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: Route inconnue
    BadGateway:
      description: Microservice injoignable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: Service indisponible
