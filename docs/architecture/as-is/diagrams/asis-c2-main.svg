<g class="box"><rect x="700" y="110" width="200" height="150" rx="14" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><circle cx="800" cy="104" r="26.5" fill="#ffffff"/><circle cx="800" cy="104" r="24" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><text x="800" y="167" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Utilisateur inscrit</text><text x="800" y="182" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Person]</text><text x="800" y="202" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Se connecte et gère ses favoris</text><text x="800" y="216" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">(écrans présents ; Auth seulement</text><text x="800" y="230" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">sur dev).</text></g>
<g class="box"><rect x="480" y="380" width="240" height="140" fill="#1e88e5" stroke="#1561a4" stroke-width="1"/><path d="M480,400 L720,400" fill="none" stroke="#1561a4" stroke-width="1"/><path d="M516,386 L712,386 L712,394 L516,394 Z" fill="none" stroke="#1561a4" stroke-width="1"/><text x="600" y="426" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Application web</text><text x="600" y="441" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Container: React, TypeScript, Vite</text><text x="600" y="455" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">(serveur de dev)]</text><text x="600" y="475" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">SPA : accueil, recherche, lecteur,</text><text x="600" y="489" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">connexion, favoris. Appelle /api en relatif,</text><text x="600" y="503" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">JWT en localStorage.</text></g>
<g class="box"><rect x="480" y="680" width="240" height="140" rx="6" fill="#1e88e5" stroke="#1561a4" stroke-width="1"/><text x="600" y="723" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Service Catalog</text><text x="600" y="738" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Container: Python 3.12, FastAPI,</text><text x="600" y="752" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">SQLAlchemy, ffmpeg (port 8002)]</text><text x="600" y="772" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Métadonnées des vidéos, recherche,</text><text x="600" y="786" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">mises en avant et miniatures.</text></g>
<g class="box"><path d="M280,989 A120,9 0 0 1 520,989 L520,1111 A120,9 0 0 1 280,1111 Z" fill="#00796b" stroke="#00574d" stroke-width="1"/><path d="M280,989 A120,9 0 0 0 520,989" fill="none" stroke="#73b5ae" stroke-width="1"/><text x="400" y="1041" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Base Catalog</text><text x="400" y="1056" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Container: MariaDB 11]</text><text x="400" y="1076" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Tables videos et tags.</text></g>
<g class="box"><rect x="680" y="980" width="80" height="10" fill="#00796b" stroke="#00574d" stroke-width="1"/><rect x="680" y="990" width="240" height="130" fill="#00796b" stroke="#00574d" stroke-width="1"/><text x="800" y="1021" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Fichiers média</text><text x="800" y="1036" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Container: Système de fichiers (bind</text><text x="800" y="1050" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">mount datasets/videos, volume</text><text x="800" y="1064" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">catalog-thumbs)]</text><text x="800" y="1084" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Vidéos sources (lecture seule) et</text><text x="800" y="1098" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">miniatures générées.</text></g>
<g class="label"><rect x="416" y="297" width="129" height="47" rx="3" fill="#ffffff"/><text x="480" y="311" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Parcourt, recherche et</text><text x="480" y="324" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">regarde des vidéos</text><text x="480" y="337" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="middle">[HTTPS (navigateur)]</text></g>
<g class="label"><rect x="651" y="297" width="139" height="47" rx="3" fill="#ffffff"/><text x="720" y="311" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Se connecte et gère ses</text><text x="720" y="324" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">favoris</text><text x="720" y="337" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="middle">[HTTPS (navigateur)]</text></g>
<g class="label"><rect x="533" y="570" width="134" height="60" rx="3" fill="#ffffff"/><text x="600" y="584" font-family="Inter, sans-serif" font-size="11" fill="#c62828" text-anchor="middle">Appelle tout /api via le</text><text x="600" y="597" font-family="Inter, sans-serif" font-size="11" fill="#c62828" text-anchor="middle">proxy Vite, sans passer</text><text x="600" y="610" font-family="Inter, sans-serif" font-size="11" fill="#c62828" text-anchor="middle">par la passerelle</text><text x="600" y="623" font-family="Inter, sans-serif" font-size="11" fill="#c62828" text-anchor="middle">[JSON/HTTP]</text></g>
<g class="label"><rect x="510" y="907" width="120" height="47" rx="3" fill="#ffffff"/><text x="570" y="921" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Lit et écrit les vidéos</text><text x="570" y="934" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">et les tags</text><text x="570" y="947" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="middle">[SQL (PyMySQL)]</text></g>
