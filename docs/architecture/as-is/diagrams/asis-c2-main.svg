<g class="title"><text x="240" y="1191" font-family="Inter, sans-serif" font-size="15" font-weight="bold" fill="#14171a" text-anchor="start">Stream321 - conteneurs, branche main (as-is)</text></g>
<g class="subtitle"><text x="240" y="1206" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="start">Seulement ce qui est sur main. Rouge : violation (la SPA joint Catalog sans passerelle).</text></g>
