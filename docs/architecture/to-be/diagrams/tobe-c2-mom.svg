<g class="box"><rect x="440" y="1090" width="240" height="140" rx="6" fill="#1e88e5" stroke="#1561a4" stroke-width="1"/><text x="560" y="1126" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Service Auth</text><text x="560" y="1141" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Container: Python 3.12, FastAPI,</text><text x="560" y="1155" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">SQLAlchemy, PyJWT EdDSA, aio-pika]</text><text x="560" y="1175" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Comptes, émission des JWT (Ed25519),</text><text x="560" y="1189" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">favoris ; garde une copie locale des</text><text x="560" y="1203" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">vidéos connues.</text></g>
<g class="box"><rect x="800" y="1090" width="240" height="140" rx="6" fill="#1e88e5" stroke="#1561a4" stroke-width="1"/><text x="920" y="1126" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Service Catalog</text><text x="920" y="1141" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Container: Python 3.12, FastAPI,</text><text x="920" y="1155" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">SQLAlchemy, aio-pika]</text><text x="920" y="1175" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Métadonnées, recherche et miniatures</text><text x="920" y="1189" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">(stockées en base) ; valide les vidéos</text><text x="920" y="1203" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">annoncées par le bus.</text></g>
<g class="box"><rect x="1160" y="1090" width="240" height="140" rx="6" fill="#1e88e5" stroke="#1561a4" stroke-width="1"/><text x="1280" y="1126" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Service Média</text><text x="1280" y="1141" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Container: Python 3.12, FastAPI, ffmpeg,</text><text x="1280" y="1155" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">aio-pika]</text><text x="1280" y="1175" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Reçoit les vidéos (202), crée la miniature,</text><text x="1280" y="1189" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">publie video.uploaded ; sert les MP4 par</text><text x="1280" y="1203" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">plages (206).</text></g>
<g class="box"><path d="M89,1730 L1751,1730 A9,70 0 0 1 1751,1870 L89,1870 A9,70 0 0 1 89,1730 Z" fill="#6a1b9a" stroke="#ff6d00" stroke-width="5"/><path d="M1751,1730 A9,70 0 0 0 1751,1870" fill="none" stroke="#ff6d00" stroke-width="5"/><text x="915" y="1787" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Bus de messages</text><text x="915" y="1802" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Container: RabbitMQ 3 (AMQP 0-9-1)]</text><text x="915" y="1822" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">MOM : exchange topic stream321.events, une file durable par service consommateur.</text></g>
<g class="label"><rect x="1207" y="1457" width="147" height="47" rx="3" fill="#ffffff"/><text x="1280" y="1471" font-family="Inter, sans-serif" font-size="11" fill="#e65100" text-anchor="middle">Publie video.uploaded ;</text><text x="1280" y="1484" font-family="Inter, sans-serif" font-size="11" fill="#e65100" text-anchor="middle">consomme video.rejected</text><text x="1280" y="1497" font-family="Inter, sans-serif" font-size="11" fill="#e65100" text-anchor="middle">[AMQP]</text></g>
<g class="label"><rect x="843" y="1437" width="155" height="86" rx="3" fill="#ffffff"/><text x="920" y="1451" font-family="Inter, sans-serif" font-size="11" fill="#e65100" text-anchor="middle">Consomme video.uploaded</text><text x="920" y="1464" font-family="Inter, sans-serif" font-size="11" fill="#e65100" text-anchor="middle">; publie</text><text x="920" y="1477" font-family="Inter, sans-serif" font-size="11" fill="#e65100" text-anchor="middle">video.published,</text><text x="920" y="1490" font-family="Inter, sans-serif" font-size="11" fill="#e65100" text-anchor="middle">video.removed et</text><text x="920" y="1503" font-family="Inter, sans-serif" font-size="11" fill="#e65100" text-anchor="middle">video.rejected</text><text x="920" y="1516" font-family="Inter, sans-serif" font-size="11" fill="#e65100" text-anchor="middle">[AMQP]</text></g>
<g class="label"><rect x="482" y="1457" width="157" height="47" rx="3" fill="#ffffff"/><text x="560" y="1471" font-family="Inter, sans-serif" font-size="11" fill="#e65100" text-anchor="middle">Consomme video.published</text><text x="560" y="1484" font-family="Inter, sans-serif" font-size="11" fill="#e65100" text-anchor="middle">et video.removed</text><text x="560" y="1497" font-family="Inter, sans-serif" font-size="11" fill="#e65100" text-anchor="middle">[AMQP]</text></g>
<g class="title"><text x="40" y="1941" font-family="Inter, sans-serif" font-size="15" font-weight="bold" fill="#14171a" text-anchor="start">Stream321 - flux d&apos;événements par le bus de messages (cible)</text></g>
<g class="subtitle"><text x="40" y="1956" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="start">Passerelle /api/v2 unique, aucun appel direct entre services, événements via RabbitMQ (pointillés).</text></g>
