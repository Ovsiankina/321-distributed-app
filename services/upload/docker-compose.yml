services:
  upload:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:8003"
    environment:
      UPLOAD_DATA_DIR: /data/videos
      UPLOAD_AMQP_URL: amqp://stream:stream@rabbitmq:5672/
    volumes:
      - media-videos:/data/videos
    networks:
      - default
      - stream321

volumes:
  media-videos:

networks:
  stream321:
    external: true
    name: stream321
