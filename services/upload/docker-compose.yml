services:
  upload:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:8003"
    environment:
      UPLOAD_DATA_DIR: /data/videos
      UPLOAD_AMQP_URL: amqp://guest:guest@host.docker.internal:5672/
    volumes:
      - media-videos:/data/videos

volumes:
  media-videos:
