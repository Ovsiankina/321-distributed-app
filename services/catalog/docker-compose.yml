services:
  catalog-db:
    image: mariadb:11
    environment:
      MARIADB_USER: catalog
      MARIADB_PASSWORD: catalog
      MARIADB_DATABASE: catalog
      MARIADB_ROOT_PASSWORD: catalog-root
    volumes:
      - catalog-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"
    environment:
      CATALOG_DATABASE_URL: mariadb+pymysql://catalog@catalog-db:3306/catalog
      CATALOG_DB_PASSWORD: catalog
      CATALOG_AMQP_URL: amqp://stream:stream@rabbitmq:5672/
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - default
      - stream321

volumes:
  catalog-mariadb-data:

networks:
  stream321:
    external: true
    name: stream321
